[tool.poetry]
name = "macsentry"
version = "0.8.0"
description = "Local security and privacy monitoring for macOS — processes, ports, and network connections in one view"
authors = ["Eyuel Abebe <eyueld@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/EyuelAbebe/macsentry"
repository = "https://github.com/EyuelAbebe/macsentry"
documentation = "https://github.com/EyuelAbebe/macsentry#readme"
keywords = ["security", "privacy", "monitoring", "processes", "network", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Networking :: Monitoring",
]
packages = [{include = "sentinel", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
typer = ">=0.12"
rich = ">=13"
psutil = ">=6"
pydantic = ">=2"
pydantic-settings = ">=2"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
# TUI is optional — install with: pip install macsentry[tui]
textual = {version = ">=0.80", optional = true}
# HTTP API is optional — install with: pip install macsentry[api]
fastapi = {version = ">=0.111", optional = true}
uvicorn = {extras = ["standard"], version = "^0.52.4", optional = true}

[tool.poetry.extras]
tui = ["textual"]
api = ["fastapi", "uvicorn"]
all = ["textual", "fastapi", "uvicorn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"
ruff = ">=0.5"
mypy = ">=1.10"
types-psutil = "*"
pre-commit = ">=3"
httpx = "^0.28.1"

[tool.poetry.scripts]
sentinel = "sentinel.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── tool config ────────────────────────────────────────────────────────────

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sentinel"]  # Python import name stays sentinel; distribution name is macsentry

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/sentinel"]
